<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./script.js" defer></script>
    <title>Local Storage</title>
  </head>
  <body style="font-family: cursive; text-align: center">
    <h1>Local Storage</h1>
    <hr />
    <input
      type="text"
      style="
        width: 90%;
        padding: 8px 16px;
        border-radius: 16px;
        margin-bottom: 0px;
        font-size: 16px;
        font-family: cursive;
      "
      class="name"
    />
    <h3 style="margin-top: 0">My name is <span class="name-tag"></span></h3>
    <hr />
    <input
      type="number"
      style="
        width: 90%;
        padding: 8px 16px;
        border-radius: 16px;
        margin-bottom: 0px;
        font-size: 16px;
        font-family: cursive;
      "
      class="age"
    />
    <h3 style="margin-top: 0">My age is <span class="age-tag"></span></h3>
    <hr />
  </body>
</html>
